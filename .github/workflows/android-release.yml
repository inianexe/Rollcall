name: Build and publish Android preview
on:
  push:
    branches: [main]
    paths: ['android/**', 'docs/release-v1.0.0.md', '.github/workflows/android-release.yml']
permissions:
  contents: write
concurrency:
  group: rollcall-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug
      - name: Add APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Create or update Android preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.0
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          checksum=android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber
          else
            gh release create "$tag" "$apk" "$checksum" --target "$GITHUB_SHA" \
              --title "Rollcall v1.0.0 — Android Preview" \
              --notes-file docs/release-v1.0.0.md --latest
          fi
