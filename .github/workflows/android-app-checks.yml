name: Android app checks

# Verify app changes without invoking the Macrobenchmark module's ordinary debug variant.
# Macrobenchmark must use :macrobenchmark:connectedBenchmarkAndroidTest on its
# non-debuggable benchmark target; it is intentionally excluded from this workflow.
on:
  push:
    branches:
      - codex/rollcall-torch-ui
    paths:
      - 'android/**'
      - '.github/workflows/android-app-checks.yml'
  pull_request:
    branches:
      - codex/rollcall-torch-ui
    paths:
      - 'android/**'
      - '.github/workflows/android-app-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App JVM, build, and emulator tests (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Run scoped JVM tests and build app debug artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run only app instrumentation on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Preserve app test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollcall-app-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
