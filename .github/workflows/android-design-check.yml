name: Android Java verification
on:
  push:
    branches:
      - refactor/rollcall-java-torch
    paths:
      - 'android/**'
      - '.github/workflows/android-design-check.yml'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'
      - 'docs/architecture/**'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-design-check.yml'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/architecture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM tests and build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload JVM test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollcall-jvm-test-reports
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
