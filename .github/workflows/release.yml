name: Validate and release Rollcall
on:
  push:
    branches: [main]
    paths: ['extension/**', 'scripts/package.py', 'docs/release-*.md', '.github/workflows/release.yml', 'package.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rollcall-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 scripts/package.py
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify unpacked extension loading
        run: |
          mkdir -p /tmp/rollcall-install
          unzip dist/*-browser.zip -d /tmp/rollcall-install
          node scripts/test-install.cjs /tmp/rollcall-install
      - name: Publish validated package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; keeping its immutable version assets."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Rollcall $tag — Clearer Chrome Installation" --notes-file "docs/release-$tag.md" --latest
          fi
