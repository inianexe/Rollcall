name: Publish versioned Rollcall APK and notify users

on:
  push:
    branches: [main]
    paths:
      - "Rollcall V1.apk"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release files
        uses: actions/checkout@v7

      - name: Prepare Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Verify, publish, and notify
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          apk="Rollcall V1.apk"
          test -s "$apk"
          size="$(stat -c %s "$apk")"
          test "$size" -gt 1000000
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          badging="$("$aapt" dump badging "$apk")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p")"
          test "$package_name" = "com.iniexe.rollcall"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          [[ "$version_name" =~ ^[A-Za-z0-9._-]{1,80}$ ]]
          expected_version_code="$(sed -nE 's/.*versionCode ([0-9]+).*/\1/p' android/app/build.gradle | head -1)"
          expected_version_name="$(sed -nE "s/.*versionName '([^']+)'.*/\\1/p" android/app/build.gradle | head -1)"
          test "$version_code" = "$expected_version_code"
          test "$version_name" = "$expected_version_name"

          expected_signer="19117b6b5320c6adb907834880f031d00040e0a3114a9a8d3633539349bf1bc6"
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -1)"
          test "$signer" = "$expected_signer"

          release_apk="Rollcall-${version_name}.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"

          cat > /tmp/rollcall-release-notes.md <<NOTES
          <!-- rollcall-version-code: $version_code -->
          <!-- rollcall-version-name: $version_name -->
          # Rollcall $version_name

          Download **$release_apk** below. It is signed with Rollcall’s release key and distributed outside Google Play, so Chrome or Android may still show security warnings. Install steps and screenshots are in the README.

          The matching SHA-256 checksum is included alongside the APK.
          NOTES

          tag="v${version_name}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Historical releases and assets are never overwritten by this workflow."
            exit 1
          fi
          gh release create "$tag" "$release_apk" "$release_apk.sha256" --target "$GITHUB_SHA" \
            --title "Rollcall ${version_name} — Android Preview" --notes-file /tmp/rollcall-release-notes.md --latest

          uploaded_size="$(gh api "repos/inianexe/Rollcall/releases/tags/$tag" --jq '.assets[] | select(.name | endswith(".apk")) | .size')"
          test "$uploaded_size" -eq "$size"

          npm install --prefix "$RUNNER_TEMP/firebase-admin" firebase-admin@13
          NODE_PATH="$RUNNER_TEMP/firebase-admin/node_modules" \
            VERSION_CODE="$version_code" VERSION_NAME="$version_name" node <<'NODE'
          const admin = require('firebase-admin');
          (async () => {
            const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '{}');
            if (serviceAccount.project_id !== 'rollcall-ab5d1'
                || !serviceAccount.private_key || !serviceAccount.client_email) {
              throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON is missing or belongs to another Firebase project.');
            }
            admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
            const id = await admin.messaging().send({
              topic: 'app_updates',
              data: {
                type: 'update',
                versionCode: process.env.VERSION_CODE,
                versionName: process.env.VERSION_NAME,
                releaseTag: `v${process.env.VERSION_NAME}`,
                releaseTitle: `Rollcall ${process.env.VERSION_NAME}`
              },
              android: { priority: 'high' }
            });
            console.log(`Update announced: ${id}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
