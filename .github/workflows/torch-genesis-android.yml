name: Torch Genesis Android verification

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/torch-genesis-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android and unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Attach test build
        uses: actions/upload-artifact@v4
        with:
          name: rollcall-torch-exact-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
