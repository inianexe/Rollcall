name: Torch Genesis Android verification

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/torch-genesis-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the packaged Torch JavaScript and markup
        run: |
          node --check android/app/src/main/assets/rollcall_torch_runtime.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android/app/src/main/assets/rollcall_torch_native.html').read_text()
          js = Path('android/app/src/main/assets/rollcall_torch_runtime.js').read_text()
          for page in ['home','courses','week','what','marks','settings','leave']:
              assert f'id="page-{page}"' in html, page
          assert 'rollcall_torch_runtime.js' in html
          assert 'const courses=[{id:' not in html, 'The sample prototype script should not ship'
          assert '__rollcallRender' in js
          assert 'RollcallBridge' in js
          assert 'fonts/JetBrainsMono-Regular.ttf' in html
          print('Torch assets and live-data bindings verified')
          PY
      - name: Compile Android and unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Attach test build
        uses: actions/upload-artifact@v4
        with:
          name: rollcall-torch-exact-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
