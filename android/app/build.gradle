plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningPropertiesFile = new File(System.getProperty('user.home'), '.config/rollcall/release-signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def releasePasswordFile = releaseSigningProperties.getProperty('passwordFile')
def releasePassword = releasePasswordFile ? new File(releasePasswordFile) : null
def releaseSigningReady = releaseSigningPropertiesFile.isFile() && releaseSigningProperties.getProperty('storeFile') && releaseSigningProperties.getProperty('keyAlias') && releasePassword?.isFile()

android {
    namespace 'com.iniexe.rollcall'
    compileSdk 35
    defaultConfig {
        applicationId 'com.iniexe.rollcall'
        minSdk 23
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 25
        versionName '1.0.24'
        buildConfigField 'String', 'ROLLCALL_API_BASE_URL', '"' + (project.findProperty('rollcallApiBaseUrl') ?: 'https://rollcall-campus-companion.pages.dev/api') + '"'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releasePassword.text.trim()
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releasePassword.text.trim()
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    kotlinOptions { jvmTarget = '1.8' }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing is not configured. See android/README.md for the local signing setup.')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'packageRelease' || task.name == 'bundleRelease') {
        task.dependsOn('requireReleaseSigning')
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'com.airbnb.android:lottie-compose:6.7.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.03')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
